<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#000000">

    <title>J.A.R.V.I.S Mobile Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>


    <!-- JARVIS CORE -->

    <section class="core-section">

        <div class="core">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="center"></div>
        </div>

        <p class="core-text">
            SYSTEM READY
        </p>

    </section>


    <!-- SYSTEM STATUS -->

    <section class="status">

        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="row">
            <span>AI ENGINE</span>
            <b class="on">● OPERATIONAL</b>
        </div>

        <div class="row">
            <span>CONNECTION</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE INTERFACE</span>
            <b class="on">● READY</b>
        </div>

        <div class="row">
            <span>LONG-TERM MEMORY</span>
            <b class="on">● ACTIVE</b>
        </div>

    </section>


    <!-- CHAT -->

    <section
        id="chat"
        class="chat"
        aria-live="polite"
    ></section>


    <!-- INPUT -->

    <section class="input-area">

        <input
            id="msg"
            type="text"
            placeholder="Enter a command for J.A.R.V.I.S..."
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
        >
            EXECUTE
        </button>

        <!-- Separate controls file -->
        <div
            id="assistant-buttons"
            class="assistant-buttons"
        >
            Loading...
        </div>

    </section>


    <!-- Image input -->

    <input
        id="img-input"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
    >


    <!-- Load controls -->

    <script>

        fetch("./mic-button.html")
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "mic-button.html could not be loaded"
                    );
                }

                return response.text();

            })

            .then(html => {

                document.getElementById(
                    "assistant-buttons"
                ).innerHTML = html;

            })

            .catch(error => {

                console.error(
                    "Controls error:",
                    error
                );

                document.getElementById(
                    "assistant-buttons"
                ).innerHTML =
                    "<span>Controls unavailable</span>";

            });

    </script>


    <!-- IMPORTANT:
         Load JavaScript normally.
         Do NOT load it from inside fetch(). -->

    <script src="./script.js"></script>

</body>

</html>
